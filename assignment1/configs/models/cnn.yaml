protocol_file: ../protocol.yaml

model:
  name: cnn
  parameters:
    input_channels: 1
    conv_channels: [32, 64]
    kernel_size: 3
    pooling_size: 2
    classifier_hidden_dim: 128
    dropout: 0.3
    num_classes: 10

training:
  batch_size: 128
  max_epochs: 100
  loss: cross_entropy
  optimizer:
    name: adam
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    enabled: false
  early_stopping:
    enabled: true
    monitor: val_macro_f1
    mode: max
    patience: 15
    min_delta: 0.0001
