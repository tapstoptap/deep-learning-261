protocol_file: ../protocol.yaml

model:
  name: linear
  parameters:
    input_dim: 784
    num_classes: 10

training:
  batch_size: 128
  max_epochs: 100
  loss: cross_entropy
  optimizer:
    name: adam
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    enabled: false
  early_stopping:
    enabled: true
    monitor: val_macro_f1
    mode: max
    patience: 15
    min_delta: 0.0001
