protocol_file: ../protocol.yaml

model:
  name: rnn
  parameters:
    recurrent_type: gru
    representation: image_rows
    sequence_length: 28
    input_size: 28
    hidden_size: 128
    num_layers: 1
    bidirectional: false
    dropout: 0.0
    num_classes: 10

training:
  batch_size: 128
  max_epochs: 50
  loss: cross_entropy
  optimizer:
    name: adam
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    enabled: false
  early_stopping:
    enabled: true
    monitor: val_macro_f1
    mode: max
    patience: 7
    min_delta: 0.0001
