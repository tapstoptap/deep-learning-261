# Pretrained ResNet-50 configuration
# Food-101 - Fine-tuning (E3)

seed: 42

data:
  root: data/food-101
  image_size: 224
  num_classes: 101
  train_split: train
  val_ratio: 0.1
  test_split: test

model:
  name: resnet50
  num_classes: 101
  pretrained: true
  freeze_backbone: false
  dropout: 0.2

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine

evaluation:
  metrics:
    - accuracy
    - macro_f1

output:
  checkpoint_dir: checkpoints/resnet50_finetune
  result_dir: results/resnet50_finetune
